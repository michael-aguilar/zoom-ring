<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2370" viewBox="0 0 1600 2370"><rect x="0" y="0" width="1600" height="2370" rx="0" fill="#f1f5fa" stroke="#f1f5fa" stroke-width="2"/><text x="56" y="67" font-family="Noto Sans, sans-serif" font-size="48" font-weight="700" fill="#213046" text-anchor="start">zoom controller / wiring v1</text><text x="58" y="111" font-family="Noto Sans, sans-serif" font-size="24" font-weight="400" fill="#213046" text-anchor="start">XIAO RP2040 (standard) + Adafruit DRV8833 #3297 + N20 encoder motor #4639</text><text x="58" y="149" font-family="Noto Sans, sans-serif" font-size="22" font-weight="400" fill="#5b6c81" text-anchor="start">Connection map, not physical pin placement. Repeated board names refer to the same board.</text><rect x="48" y="178" width="1504" height="407" rx="18" fill="#ffffff" stroke="#d1dae6" stroke-width="2"/><text x="76" y="224" font-family="Noto Sans, sans-serif" font-size="27" font-weight="700" fill="#78889c" text-anchor="start">01</text><text x="135" y="224" font-family="Noto Sans, sans-serif" font-size="31" font-weight="700" fill="#213046" text-anchor="start">power: one regulated 5 V USB source</text><text x="76" y="261" font-family="Noto Sans, sans-serif" font-size="22" font-weight="400" fill="#5b6c81" text-anchor="start">Use a 5 V USB pack rated at least 1 A. Motor current branches before the XIAO.</text><text x="100" y="310" font-family="Noto Sans, sans-serif" font-size="27" font-weight="700" fill="#bb3b38" text-anchor="start">USB +5 V</text><path d="M 290,302 L 380,302" fill="none" stroke="#bb3b38" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 380,302 L 430,279" fill="none" stroke="#bb3b38" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="380" cy="302" r="6" fill="#bb3b38"/><circle cx="442" cy="302" r="6" fill="#bb3b38"/><text x="361" y="346" font-family="Noto Sans, sans-serif" font-size="21" font-weight="400" fill="#213046" text-anchor="start">switch</text><path d="M 442,302 L 610,302 L 610,342 L 1045,342" fill="none" stroke="#bb3b38" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 610,342 L 610,412 L 1045,412" fill="none" stroke="#bb3b38" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="610" cy="342" r="6" fill="#bb3b38"/><text x="1070" y="350" font-family="Noto Sans, sans-serif" font-size="27" font-weight="400" fill="#213046" text-anchor="start">XIAO 5V / VBUS</text><text x="1070" y="420" font-family="Noto Sans, sans-serif" font-size="27" font-weight="400" fill="#213046" text-anchor="start">DRV8833 VM</text><text x="100" y="483" font-family="Noto Sans, sans-serif" font-size="27" font-weight="700" fill="#4c5b6b" text-anchor="start">USB ground</text><path d="M 310,475 L 650,475 L 650,505 L 1045,505" fill="none" stroke="#4c5b6b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 650,475 L 1045,475" fill="none" stroke="#4c5b6b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="650" cy="475" r="6" fill="#4c5b6b"/><text x="1070" y="483" font-family="Noto Sans, sans-serif" font-size="27" font-weight="400" fill="#213046" text-anchor="start">XIAO GND</text><text x="1070" y="532" font-family="Noto Sans, sans-serif" font-size="27" font-weight="400" fill="#213046" text-anchor="start">DRV8833 GND</text><path d="M 1045,505 L 1045,524" fill="none" stroke="#4c5b6b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 875,412 L 875,433" fill="none" stroke="#bb3b38" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="875" cy="412" r="6" fill="#bb3b38"/><path d="M 851,433 L 899,433" fill="none" stroke="#4c5b6b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 851,447 L 899,447" fill="none" stroke="#4c5b6b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 875,447 L 875,475" fill="none" stroke="#4c5b6b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="875" cy="475" r="6" fill="#4c5b6b"/><text x="910" y="439" font-family="Noto Sans, sans-serif" font-size="23" font-weight="700" fill="#bb3b38" text-anchor="start">+</text><text x="689" y="384" font-family="Noto Sans, sans-serif" font-size="22" font-weight="400" fill="#213046" text-anchor="start">470 uF, &gt;=10 V</text><text x="76" y="558" font-family="Noto Sans, sans-serif" font-size="22" font-weight="400" fill="#5b6c81" text-anchor="start">C1 sits next to the driver: + to VM, - to GND. VM pad has no reverse-polarity protection.</text><rect x="48" y="608" width="1504" height="396" rx="18" fill="#ffffff" stroke="#d1dae6" stroke-width="2"/><text x="76" y="654" font-family="Noto Sans, sans-serif" font-size="27" font-weight="700" fill="#78889c" text-anchor="start">02</text><text x="135" y="654" font-family="Noto Sans, sans-serif" font-size="31" font-weight="700" fill="#213046" text-anchor="start">nunchuck: four connections</text><text x="76" y="691" font-family="Noto Sans, sans-serif" font-size="22" font-weight="400" fill="#5b6c81" text-anchor="start">Cut-cable version. Identify the wires by function; clone colors are not standardized.</text><text x="100" y="731" font-family="Noto Sans, sans-serif" font-size="25" font-weight="700" fill="#213046" text-anchor="start">XIAO pin</text><text x="1040" y="731" font-family="Noto Sans, sans-serif" font-size="25" font-weight="700" fill="#213046" text-anchor="start">Nunchuck wire</text><text x="100" y="785" font-family="Noto Sans, sans-serif" font-size="26" font-weight="400" fill="#213046" text-anchor="start">3V3</text><path d="M 560,777 L 1010,777" fill="none" stroke="#7550ae" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="560" cy="777" r="6" fill="#7550ae"/><circle cx="1010" cy="777" r="6" fill="#7550ae"/><text x="1040" y="785" font-family="Noto Sans, sans-serif" font-size="26" font-weight="400" fill="#213046" text-anchor="start">VCC / 3.3 V</text><text x="100" y="834" font-family="Noto Sans, sans-serif" font-size="26" font-weight="400" fill="#213046" text-anchor="start">GND</text><path d="M 560,826 L 1010,826" fill="none" stroke="#4c5b6b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="560" cy="826" r="6" fill="#4c5b6b"/><circle cx="1010" cy="826" r="6" fill="#4c5b6b"/><text x="1040" y="834" font-family="Noto Sans, sans-serif" font-size="26" font-weight="400" fill="#213046" text-anchor="start">GND</text><text x="100" y="883" font-family="Noto Sans, sans-serif" font-size="26" font-weight="400" fill="#213046" text-anchor="start">D4 / GPIO6</text><path d="M 560,875 L 1010,875" fill="none" stroke="#2668a5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="560" cy="875" r="6" fill="#2668a5"/><circle cx="1010" cy="875" r="6" fill="#2668a5"/><text x="1040" y="883" font-family="Noto Sans, sans-serif" font-size="26" font-weight="400" fill="#213046" text-anchor="start">SDA (data)</text><text x="100" y="932" font-family="Noto Sans, sans-serif" font-size="26" font-weight="400" fill="#213046" text-anchor="start">D5 / GPIO7</text><path d="M 560,924 L 1010,924" fill="none" stroke="#2668a5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="560" cy="924" r="6" fill="#2668a5"/><circle cx="1010" cy="924" r="6" fill="#2668a5"/><text x="1040" y="932" font-family="Noto Sans, sans-serif" font-size="26" font-weight="400" fill="#213046" text-anchor="start">SCL (clock)</text><text x="100" y="971" font-family="Noto Sans, sans-serif" font-size="22" font-weight="400" fill="#5b6c81" text-anchor="start">R1, R2: 4.7k each from SDA and SCL to 3V3. Use only one suitable pull-up set.</text><rect x="48" y="1027" width="1504" height="340" rx="18" fill="#ffffff" stroke="#d1dae6" stroke-width="2"/><text x="76" y="1073" font-family="Noto Sans, sans-serif" font-size="27" font-weight="700" fill="#78889c" text-anchor="start">03</text><text x="135" y="1073" font-family="Noto Sans, sans-serif" font-size="31" font-weight="700" fill="#213046" text-anchor="start">motor-driver control</text><text x="76" y="1110" font-family="Noto Sans, sans-serif" font-size="22" font-weight="400" fill="#5b6c81" text-anchor="start">3.3 V signals are valid for this driver. SLP is low/asleep by default.</text><text x="100" y="1150" font-family="Noto Sans, sans-serif" font-size="25" font-weight="700" fill="#213046" text-anchor="start">XIAO pin</text><text x="1040" y="1150" font-family="Noto Sans, sans-serif" font-size="25" font-weight="700" fill="#213046" text-anchor="start">DRV8833 pin</text><text x="100" y="1203" font-family="Noto Sans, sans-serif" font-size="26" font-weight="400" fill="#213046" text-anchor="start">D6 / GPIO0 (PWM)</text><path d="M 560,1195 L 1010,1195" fill="none" stroke="#2668a5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="560" cy="1195" r="6" fill="#2668a5"/><circle cx="1010" cy="1195" r="6" fill="#2668a5"/><text x="1040" y="1203" font-family="Noto Sans, sans-serif" font-size="26" font-weight="400" fill="#213046" text-anchor="start">AIN1</text><text x="100" y="1252" font-family="Noto Sans, sans-serif" font-size="26" font-weight="400" fill="#213046" text-anchor="start">D7 / GPIO1 (PWM)</text><path d="M 560,1244 L 1010,1244" fill="none" stroke="#2668a5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="560" cy="1244" r="6" fill="#2668a5"/><circle cx="1010" cy="1244" r="6" fill="#2668a5"/><text x="1040" y="1252" font-family="Noto Sans, sans-serif" font-size="26" font-weight="400" fill="#213046" text-anchor="start">AIN2</text><text x="100" y="1301" font-family="Noto Sans, sans-serif" font-size="26" font-weight="400" fill="#213046" text-anchor="start">D0 / GPIO26 (enable)</text><path d="M 560,1293 L 1010,1293" fill="none" stroke="#2668a5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="560" cy="1293" r="6" fill="#2668a5"/><circle cx="1010" cy="1293" r="6" fill="#2668a5"/><text x="1040" y="1301" font-family="Noto Sans, sans-serif" font-size="26" font-weight="400" fill="#213046" text-anchor="start">SLP</text><text x="100" y="1339" font-family="Noto Sans, sans-serif" font-size="22" font-weight="400" fill="#5b6c81" text-anchor="start">Firmware: keep SLP low at boot; enable only with valid input. Configure D2/D3 as INPUT_PULLUP.</text><rect x="48" y="1390" width="1504" height="483" rx="18" fill="#ffffff" stroke="#d1dae6" stroke-width="2"/><text x="76" y="1436" font-family="Noto Sans, sans-serif" font-size="27" font-weight="700" fill="#78889c" text-anchor="start">04</text><text x="135" y="1436" font-family="Noto Sans, sans-serif" font-size="31" font-weight="700" fill="#213046" text-anchor="start">motor + encoder: six connections</text><text x="76" y="1473" font-family="Noto Sans, sans-serif" font-size="22" font-weight="400" fill="#5b6c81" text-anchor="start">Wire colors below apply ONLY to Adafruit motor #4639. Other motors can differ.</text><text x="100" y="1513" font-family="Noto Sans, sans-serif" font-size="25" font-weight="700" fill="#213046" text-anchor="start">Source / board pin</text><text x="1040" y="1513" font-family="Noto Sans, sans-serif" font-size="25" font-weight="700" fill="#213046" text-anchor="start">Motor cable wire</text><text x="100" y="1566" font-family="Noto Sans, sans-serif" font-size="26" font-weight="400" fill="#213046" text-anchor="start">DRV8833 motor A output 1</text><path d="M 560,1558 L 1010,1558" fill="none" stroke="#bb3b38" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="560" cy="1558" r="6" fill="#bb3b38"/><circle cx="1010" cy="1558" r="6" fill="#bb3b38"/><text x="1040" y="1566" font-family="Noto Sans, sans-serif" font-size="26" font-weight="400" fill="#213046" text-anchor="start">red: motor terminal</text><text x="100" y="1615" font-family="Noto Sans, sans-serif" font-size="26" font-weight="400" fill="#213046" text-anchor="start">DRV8833 motor A output 2</text><path d="M 560,1607 L 1010,1607" fill="none" stroke="#bb3b38" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="560" cy="1607" r="6" fill="#bb3b38"/><circle cx="1010" cy="1607" r="6" fill="#bb3b38"/><text x="1040" y="1615" font-family="Noto Sans, sans-serif" font-size="26" font-weight="400" fill="#213046" text-anchor="start">white: motor terminal</text><text x="100" y="1664" font-family="Noto Sans, sans-serif" font-size="26" font-weight="400" fill="#213046" text-anchor="start">XIAO 3V3</text><path d="M 560,1656 L 1010,1656" fill="none" stroke="#7550ae" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="560" cy="1656" r="6" fill="#7550ae"/><circle cx="1010" cy="1656" r="6" fill="#7550ae"/><text x="1040" y="1664" font-family="Noto Sans, sans-serif" font-size="26" font-weight="400" fill="#213046" text-anchor="start">black: encoder VCC</text><text x="100" y="1713" font-family="Noto Sans, sans-serif" font-size="26" font-weight="400" fill="#213046" text-anchor="start">common GND</text><path d="M 560,1705 L 1010,1705" fill="none" stroke="#4c5b6b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="560" cy="1705" r="6" fill="#4c5b6b"/><circle cx="1010" cy="1705" r="6" fill="#4c5b6b"/><text x="1040" y="1713" font-family="Noto Sans, sans-serif" font-size="26" font-weight="400" fill="#213046" text-anchor="start">blue: encoder GND</text><text x="100" y="1762" font-family="Noto Sans, sans-serif" font-size="26" font-weight="400" fill="#213046" text-anchor="start">XIAO D2 / GPIO28</text><path d="M 560,1754 L 1010,1754" fill="none" stroke="#2668a5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="560" cy="1754" r="6" fill="#2668a5"/><circle cx="1010" cy="1754" r="6" fill="#2668a5"/><text x="1040" y="1762" font-family="Noto Sans, sans-serif" font-size="26" font-weight="400" fill="#213046" text-anchor="start">yellow: encoder channel</text><text x="100" y="1811" font-family="Noto Sans, sans-serif" font-size="26" font-weight="400" fill="#213046" text-anchor="start">XIAO D3 / GPIO29</text><path d="M 560,1803 L 1010,1803" fill="none" stroke="#2668a5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="560" cy="1803" r="6" fill="#2668a5"/><circle cx="1010" cy="1803" r="6" fill="#2668a5"/><text x="1040" y="1811" font-family="Noto Sans, sans-serif" font-size="26" font-weight="400" fill="#213046" text-anchor="start">green: encoder channel</text><text x="100" y="1848" font-family="Noto Sans, sans-serif" font-size="22" font-weight="400" fill="#5b6c81" text-anchor="start">C2: 100 nF ceramic across red + white at the motor. Neither motor lead goes to GND.</text><rect x="48" y="1896" width="1504" height="414" rx="18" fill="#ffffff" stroke="#d1dae6" stroke-width="2"/><text x="76" y="1942" font-family="Noto Sans, sans-serif" font-size="27" font-weight="700" fill="#78889c" text-anchor="start">05</text><text x="135" y="1942" font-family="Noto Sans, sans-serif" font-size="31" font-weight="700" fill="#213046" text-anchor="start">small parts + build checks</text><text x="76" y="1979" font-family="Noto Sans, sans-serif" font-size="22" font-weight="400" fill="#5b6c81" text-anchor="start">All grounds are common. GPIO, nunchuck power and encoder power stay at 3.3 V.</text><text x="100" y="2026" font-family="Noto Sans, sans-serif" font-size="24" font-weight="700" fill="#7550ae" text-anchor="start">3V3</text><path d="M 184,2018 L 240,2018" fill="none" stroke="#7550ae" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="240" y="2007" width="95" height="22" rx="0" fill="#f8fafc" stroke="#7550ae" stroke-width="2"/><path d="M 335,2018 L 430,2018" fill="none" stroke="#2668a5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="255" y="2057" font-family="Noto Sans, sans-serif" font-size="22" font-weight="400" fill="#213046" text-anchor="start">4.7k</text><text x="445" y="2026" font-family="Noto Sans, sans-serif" font-size="24" font-weight="400" fill="#2668a5" text-anchor="start">SDA</text><text x="100" y="2111" font-family="Noto Sans, sans-serif" font-size="24" font-weight="700" fill="#7550ae" text-anchor="start">3V3</text><path d="M 184,2103 L 240,2103" fill="none" stroke="#7550ae" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="240" y="2092" width="95" height="22" rx="0" fill="#f8fafc" stroke="#7550ae" stroke-width="2"/><path d="M 335,2103 L 430,2103" fill="none" stroke="#2668a5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="255" y="2142" font-family="Noto Sans, sans-serif" font-size="22" font-weight="400" fill="#213046" text-anchor="start">4.7k</text><text x="445" y="2111" font-family="Noto Sans, sans-serif" font-size="24" font-weight="400" fill="#2668a5" text-anchor="start">SCL</text><text x="610" y="2017" font-family="Noto Sans, sans-serif" font-size="23" font-weight="700" fill="#213046" text-anchor="start">1. Unplug external 5 V before PC USB programming.</text><text x="610" y="2056" font-family="Noto Sans, sans-serif" font-size="23" font-weight="400" fill="#213046" text-anchor="start">2. Keep motor wires short and away from I2C wires.</text><text x="610" y="2095" font-family="Noto Sans, sans-serif" font-size="23" font-weight="400" fill="#213046" text-anchor="start">3. Stock driver current limit is 1 A, not lens protection.</text><text x="610" y="2134" font-family="Noto Sans, sans-serif" font-size="23" font-weight="400" fill="#213046" text-anchor="start">   Lower limit: replace its A-channel sense resistor.</text><text x="610" y="2173" font-family="Noto Sans, sans-serif" font-size="23" font-weight="400" fill="#213046" text-anchor="start">   I_limit = 0.2 / R_sense; do not add it in parallel.</text><text x="100" y="2228" font-family="Noto Sans, sans-serif" font-size="23" font-weight="400" fill="#213046" text-anchor="start">Start with motor/pulley detached. Firmware needs soft ramps, travel limits and stop-on-input-loss.</text><text x="100" y="2267" font-family="Noto Sans, sans-serif" font-size="23" font-weight="400" fill="#213046" text-anchor="start">Encoder feedback is relative: initialize a known position; belt slip is not sensed at the lens.</text><text x="58" y="2348" font-family="Noto Sans, sans-serif" font-size="21" font-weight="400" fill="#5b6c81" text-anchor="start">Checked against Seeed + Adafruit documentation, 2026-10-15. Not bench-tested; lens torque/gearing not yet sized.</text></svg>